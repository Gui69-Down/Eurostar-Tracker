name: Track Eurostar prices

on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Scrape prices
        run: python scraper/scrape.py

      - name: Build report + send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/alerts.py

      - name: Commit data
        run: |
          git config user.name "eurostar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/data.json
          git diff --cached --quiet || git commit -m "prices $(date -u +'%Y-%m-%d %H:%M')"
          git push
